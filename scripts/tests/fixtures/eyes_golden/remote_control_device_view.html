<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Remote Control / Telepresence</title><style>html,body{margin:0;height:100%;background:#000;overflow:hidden}#rig{width:100%;height:100%;display:flex;align-items:center;justify-content:center}.housing{width:76vmin;height:76vmin;margin:0 6vmin;border-radius:50%;position:relative;background:radial-gradient(circle at 33% 28%,#f5f5f5,#c9c9c9 22%,#8a8a8a 45%,#5a5a5a 70%,#3a3a3a 100%);box-shadow:0 0 4vmin rgba(0,0,0,.8)}.glass{position:absolute;left:9%;top:9%;width:82%;height:82%;border-radius:50%;overflow:hidden;background:#000;box-shadow:inset 0 0 3vmin rgba(0,0,0,.9)}.glow{position:absolute;width:70%;height:70%;left:15%;top:15%;transition:transform ease}.glow-core{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at center,#fff6d6 0%,#ffd23f 8%,#ff8a1e 22%,#e2331c 42%,#7a0f0a 62%,rgba(0,0,0,0) 78%)}.hi{position:absolute;border:1.2vmin solid rgba(255,255,255,.65);border-radius:50%;border-right-color:transparent;border-bottom-color:transparent;box-shadow:0 0 1.6vmin rgba(255,255,255,.3)}.hi1{width:34%;height:26%;left:14%;top:8%;transform:rotate(-30deg)}.hi2{width:18%;height:14%;left:60%;top:14%;transform:rotate(50deg)}@keyframes blink{0%,90%,100%{transform:scale(1);opacity:1}95%{transform:scale(0.85,0.08);opacity:0}}#video{display:none;width:100%;height:100%;object-fit:contain}</style></head><body><div id="rig"><div class="housing"><div class="glass"><div class="glow"><div class="glow-core"></div></div><div class="hi hi1"></div><div class="hi hi2"></div></div></div><div class="housing"><div class="glass"><div class="glow"><div class="glow-core"></div></div><div class="hi hi1"></div><div class="hi hi2"></div></div></div></div><img id="video" alt=""><script>var img=document.getElementById('video');var rig=document.getElementById('rig');var lastFrameTime=0;img.addEventListener('load',function(){rig.style.display='none';img.style.display='block';lastFrameTime=Date.now();});var wasActive=false;function pollOperatorVideo(){fetch('/operator-video-active').then(function(r){return r.text();}).then(function(t){var active=(t==='1');if(active&&!wasActive){img.src='/operator-video-stream?r='+Date.now();lastFrameTime=Date.now();}else if(!active&&wasActive){img.style.display='none';rig.style.display='flex';img.src='';}else if(active&&wasActive&&(Date.now()-lastFrameTime>5000)){img.src='/operator-video-stream?r='+Date.now();lastFrameTime=Date.now();}wasActive=active;}).catch(function(){});}pollOperatorVideo();setInterval(pollOperatorVideo,1000);var glows=document.getElementsByClassName('glow');var cores=document.getElementsByClassName('glow-core');for(var g=0;g<cores.length;g++){cores[g].style.animation='blink 6.5s infinite';cores[g].style.animationDelay=(g*0.2)+'s';}function gazeTo(x,y,speedMs){for(var g=0;g<glows.length;g++){glows[g].style.transition='transform '+speedMs+'ms cubic-bezier(.34,1.2,.4,1)';glows[g].style.transform='translate('+x+'vmin,'+y+'vmin)';}}function nextGlance(){var x=(Math.random()*20-10);var y=(Math.random()*18-9);var quick=Math.random()<0.35;var speedMs=quick?200+Math.random()*160:500+Math.random()*450;gazeTo(x,y,speedMs);var hold=quick?400+Math.random()*500:1500+Math.random()*2500;setTimeout(nextGlance,speedMs+hold);}setTimeout(nextGlance,300);</script></body></html>
