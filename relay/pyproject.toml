[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "miko3-relay"
version = "0.1.0"
description = "Relay between the Miko 3 voice mode and the owner's VoiceChat model server"
requires-python = ">=3.11"
dependencies = ["websockets>=14"]

[tool.setuptools]
packages = ["relay"]
